name: Build General Fix APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          PROJECT=$(find source -name settings.gradle | head -n 1)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeneralFix-Android-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
